<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagpur Water Basin — Experience</title>
  <style>
    /* ─── Font self-hosted (no Google request — demo must run offline) ─── */
    @font-face {
      font-family: 'EB Garamond';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/EBGaramond-Regular.ttf') format('truetype');
    }

    /* ─── Reset ─── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fdfcf5; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ─── Frame palette ─── */
    :root {
      --ink: #22201c;
      --soft: #6b655c;
      --rule: #cfc6b6;
      --red: #b23a26;
    }

    /* ─── Sheet overlay — pointer-events:none so orbit controls still work ─── */
    .sheet {
      position: fixed;
      inset: 34px;
      pointer-events: none;
      z-index: 10;
      font-family: 'EB Garamond', Georgia, serif;
      color: var(--ink);
    }

    /* ─── Ruled border ─── */
    .rule-h, .rule-v { position: absolute; background: var(--rule); }
    .rule-h { left: 0; right: 0; height: 1px; }
    .top { top: 56px; }
    .bottom { bottom: 96px; }
    .rule-v { top: 56px; bottom: 96px; width: 1px; }
    .left { left: 0; }
    .right { right: 0; }

    /* ─── Graticule (real cartography — actual lon/lat of data bounding box) ─── */
    .grat {
      position: absolute;
      display: flex;
      font-size: 10px;
      letter-spacing: .18em;
      color: var(--soft);
    }
    .grat-x {
      top: 40px;
      left: 0;
      right: 0;
      justify-content: space-between;
    }
    .grat-y {
      top: 56px;
      bottom: 96px;
      left: -26px;
      flex-direction: column;
      justify-content: space-between;
      writing-mode: horizontal-tb;
    }

    /* ─── Title ─── */
    .title {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      margin: 0;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .28em;
      font-size: clamp(30px, 4.2vw, 64px);
    }

    /* ─── Menu corner ─── */
    .menu {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 11px;
      letter-spacing: .34em;
      line-height: 1.5;
    }

    /* ─── Inset panel (nearest measurement, populated later) ─── */
    .inset {
      position: absolute;
      right: 14px;
      top: 110px;
      width: min(30vw, 380px);
      border: 1px solid var(--rule);
      background: rgba(253, 252, 245, .72);
      backdrop-filter: blur(2px);
      pointer-events: auto;
    }
    .inset-cap {
      text-align: center;
      font-size: 11px;
      letter-spacing: .24em;
      padding: 7px 0;
      border-bottom: 1px solid var(--rule);
    }
    .inset-body {
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      min-height: 60px;
    }

    /* ─── Bottom index bar ─── */
    .index {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      border-top: 1px solid var(--rule);
      padding-top: 12px;
      pointer-events: auto;
    }
    .index-scale {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--soft);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 4px;
    }
    .index ol {
      display: flex;
      justify-content: space-between;
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      font-size: 14px;
    }
    .index li { cursor: pointer; }
    .index li:hover { color: var(--red); }
    .index .go { font-style: italic; }
  </style>
</head>
<body>
  <!-- 3e: Editorial furniture — HTML overlay, zero shader risk -->
  <div class="sheet">
    <div class="rule-h top"></div><div class="rule-h bottom"></div>
    <div class="rule-v left"></div><div class="rule-v right"></div>

    <div class="grat grat-x">
      <span>78.9°</span><span>79.0°</span><span>79.1°</span>
      <span>79.2°</span><span>79.3°</span><span>79.4°</span>
    </div>
    <div class="grat grat-y">
      <span>21.3°</span><span>21.2°</span><span>21.1°</span><span>21.0°</span>
    </div>

    <h1 class="title">NAG&nbsp;BASIN</h1>
    <div class="menu">M E<br>N U</div>

    <aside class="inset">
      <div class="inset-cap">NEAREST MEASUREMENT</div>
      <div class="inset-body"><!-- populated by Step 5 --></div>
    </aside>

    <nav class="index">
      <div class="index-scale">
        <i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i>
      </div>
      <ol>
        <li>Nag</li><li>Pivli</li><li>Pora</li><li>Kanhan</li>
        <li>Kolar</li><li>Vena</li><li>Pohara</li>
        <li class="go">City wells →</li>
      </ol>
    </nav>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
